name: Package Desktop and Web

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0,<7"

      - name: Build ten standalone language executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = @(
            'generador_paisajes_es',
            'landscape_generator_en',
            'generateur_paysages_fr',
            'landschaftsgenerator_de',
            'Gerador_de_Paisagens_pt',
            'generatore_paesaggi_it',
            'generator_peyzazhey_ru',
            'landscape_generator_zh',
            'landscape_generator_ja',
            'landscape_generator_hi'
          )
          foreach ($app in $apps) {
            python -m PyInstaller --noconfirm --clean --onedir --windowed --paths . "src/$app.py"
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $app" }
          }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Landscape-Generator-Launcher launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }

      - name: Create the independent distributions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = @('generador_paisajes_es','landscape_generator_en','generateur_paysages_fr','landschaftsgenerator_de','Gerador_de_Paisagens_pt','generatore_paesaggi_it','generator_peyzazhey_ru','landscape_generator_zh','landscape_generator_ja','landscape_generator_hi')
          New-Item -ItemType Directory -Force -Path release/Desktop, release/Web | Out-Null
          New-Item -ItemType Directory -Force -Path release/Desktop/apps | Out-Null
          foreach ($app in $apps) { Copy-Item "dist/$app" "release/Desktop/apps/$app" -Recurse }
          Copy-Item dist/Landscape-Generator-Launcher/* release/Desktop/ -Recurse
          Copy-Item LICENSE release/Desktop/LICENSE-MIT.txt
          Copy-Item THIRD_PARTY_NOTICES.md release/Desktop/THIRD_PARTY_NOTICES.md
          Invoke-WebRequest "https://www.gnu.org/licenses/lgpl-3.0.txt" -OutFile release/Desktop/LGPL-3.0.txt
          Invoke-WebRequest "https://www.gnu.org/licenses/gpl-3.0.txt" -OutFile release/Desktop/GPL-3.0.txt
          Copy-Item web/index.html, web/i18n.js release/Web/
          Copy-Item LICENSE release/Web/LICENSE-MIT.txt
          @'
          LANDSCAPE GENERATOR - DESKTOP (Windows)
          Run Landscape-Generator-Launcher.exe to choose one of ten languages.
          Keep launcher.exe, its _internal folder and the complete apps folder together.
          Qt/PySide6 runtime files must remain intact; see THIRD_PARTY_NOTICES.md.
          No separate Python installation required.
          '@ | Set-Content release/Desktop/README.txt -Encoding utf8
          @'
          LANDSCAPE GENERATOR - WEB
          Open index.html in Chrome, Edge, or Firefox.
          Keep i18n.js next to index.html.
          No Python installation or internet connection required.
          '@ | Set-Content release/Web/README.txt -Encoding utf8
          Compress-Archive -Path release/Desktop/* -DestinationPath release/Landscape-Generator-Desktop-Windows.zip -Force
          Compress-Archive -Path release/Web/* -DestinationPath release/Landscape-Generator-Web.zip -Force

      - name: Upload desktop ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Landscape-Generator-Desktop-Windows
          path: release/Landscape-Generator-Desktop-Windows.zip

      - name: Upload web ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Landscape-Generator-Web
          path: release/Landscape-Generator-Web.zip

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Landscape-Generator-Desktop-Windows.zip
            release/Landscape-Generator-Web.zip
